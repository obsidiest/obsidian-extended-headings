<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title description">
  <title id="title">Extended headings H7 through H12 in Live Preview</title>
  <desc id="description">H9 is active with nine visible hashes and a caret. H7, H8, and H10 through H12 are inactive with their hashes concealed.</desc>
  <rect width="1200" height="800" fill="#24262b"/>
  <rect x="28" y="28" width="1144" height="744" rx="14" fill="#222429" stroke="#34373e" stroke-width="2"/>
  <text x="64" y="72" fill="#9a9da5" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400">Extended Headings — Live Preview</text>
  <line x1="104" y1="94" x2="104" y2="744" stroke="#34373e" stroke-width="2"/>

  <g font-family="DejaVu Sans, sans-serif">
    <g transform="translate(0 145)">
      <text x="69" y="0" fill="#777a82" font-size="28" font-weight="400" text-anchor="middle" dominant-baseline="middle">H7</text>
      <text x="132" y="0" fill="#f1f1f2" font-size="36" font-weight="500" dominant-baseline="middle">Extended Heading Level 7</text>
    </g>

    <g transform="translate(0 250)">
      <text x="69" y="0" fill="#777a82" font-size="28" font-weight="400" text-anchor="middle" dominant-baseline="middle">H8</text>
      <text x="132" y="0" fill="#f1f1f2" font-size="36" font-weight="500" dominant-baseline="middle">Extended Heading Level 8</text>
    </g>

    <rect x="45" y="296" width="1100" height="92" rx="8" fill="#2b2e34"/>
    <g transform="translate(0 342)">
      <text x="69" y="0" fill="#8a8d95" font-size="28" font-weight="400" text-anchor="middle" dominant-baseline="middle">H9</text>
      <text x="132" y="0" fill="#8a8d95" font-size="36" font-weight="500" dominant-baseline="middle">#########</text>
      <text x="418" y="0" fill="#ffffff" font-size="36" font-weight="500" dominant-baseline="middle">Extended Heading Level 9</text>
      <line x1="882" y1="-27" x2="882" y2="27" stroke="#f7f7f8" stroke-width="3"/>
    </g>

    <g transform="translate(0 447)">
      <text x="69" y="0" fill="#777a82" font-size="28" font-weight="400" text-anchor="middle" dominant-baseline="middle">H10</text>
      <text x="132" y="0" fill="#f1f1f2" font-size="36" font-weight="500" dominant-baseline="middle">Extended Heading Level 10</text>
    </g>

    <g transform="translate(0 552)">
      <text x="69" y="0" fill="#777a82" font-size="28" font-weight="400" text-anchor="middle" dominant-baseline="middle">H11</text>
      <text x="132" y="0" fill="#f1f1f2" font-size="36" font-weight="500" dominant-baseline="middle">Extended Heading Level 11</text>
    </g>

    <g transform="translate(0 657)">
      <text x="69" y="0" fill="#777a82" font-size="28" font-weight="400" text-anchor="middle" dominant-baseline="middle">H12</text>
      <text x="132" y="0" fill="#f1f1f2" font-size="36" font-weight="500" dominant-baseline="middle">Extended Heading Level 12</text>
    </g>
  </g>

  <text x="1132" y="730" fill="#777a82" font-family="DejaVu Sans, sans-serif" font-size="18" text-anchor="end">H9 active</text>
</svg>
