name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run check
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Install browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/extended-headings-browser" --no-package-lock --no-audit --no-fund playwright@1.63.0
          node "$RUNNER_TEMP/extended-headings-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Browser regression tests
        run: PLAYWRIGHT_MODULE="$RUNNER_TEMP/extended-headings-browser/node_modules/playwright" npm run test:browser
